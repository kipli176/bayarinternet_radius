services:
  bayarinternet_api:
    build: .
    container_name: bayarinternet_api
    restart: unless-stopped 
    environment:
      - DB_HOST=postgres
      - DB_USER=kipli_user
      - DB_PASSWORD=kipli_password
      - DB_NAME=bayarinternet
      - DB_PORT=5432 
    volumes:
      - .:/app
    networks:
      - cloudflared


  bayarinternet_worker:
    build: .
    container_name: bayarinternet_worker
    restart: unless-stopped 
    environment:
      - DB_HOST=postgres
      - DB_USER=kipli_user
      - DB_PASSWORD=kipli_password
      - DB_NAME=bayarinternet
      - DB_PORT=5432
    volumes:
      - .:/app
      - ./logs:/app/logs
    command: ["python", "-m", "worker.main"]
    networks:
      - cloudflared


networks:
  cloudflared:
    external: true
